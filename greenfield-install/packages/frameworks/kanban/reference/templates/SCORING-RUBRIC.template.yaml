# KMA structural scoring rubric — generic template
version: 1
project: adopter
reference_pack: packages/frameworks/kanban/reference/

dimensions:
  unique_task_coverage:
    weight: 0.25
    description: Fraction of TSP unique E:S:T IDs present in candidate output.
    formula: "|TSP ∩ output| / |TSP|"

  epic_band_parity:
    weight: 0.20
    description: Per-epic story and task counts vs TSP headers.
    formula: "1 − avg(relative error) per epic"

  title_coverage:
    weight: 0.15
    description: Named titles on matched tasks.
    formula: "named_matched / matched_tasks"

  story_filename_collision:
    weight: 0.15
    description: Penalty for duplicate story basenames within an epic folder (UXR-017).
    formula: "1 if zero collisions else max(0, 1 − collisions/10)"

  folder_alignment:
    weight: 0.15
    description: Every TSP epic has a folder per TARGET-FOLDER-MAP.yaml.
    formula: "aligned_epics / tsp_epics"

  orphan_and_reserved:
    weight: 0.10
    description: Penalty for orphan and undeclared epic-NN dirs.
    formula: "1 − (orphans + undeclared) / max(folder_count, 1)"

thresholds:
  guided_pass: 0.85
  guided_review: 0.75
  blind_typical: 0.60

scoring_modes:
  blind:
    description: Policy-only KMA without TSP input
    pass_threshold: null
  guided:
    description: KMA with TSP pack as target_est_tree
    pass_threshold: 0.85
  score_only:
    description: Maintainer diff; no file writes
    pass_threshold: 0.85
