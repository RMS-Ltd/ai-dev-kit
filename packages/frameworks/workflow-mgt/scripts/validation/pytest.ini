[pytest]
# Framework validation tests only — avoid repo root testpaths/cov and global pytest-django.
addopts =
    -p no:pytest_django
    -q
# Note: do not use --no-cov here when PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 (cov plugin not loaded).
python_files = test_*.py
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
