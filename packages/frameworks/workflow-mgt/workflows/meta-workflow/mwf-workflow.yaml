workflow:
  name: "Meta-Workflow"
  abbreviation: "MWF"
  type: meta_workflow
  description: >
    Orchestrate composite workflow chains by delegating to encapsulated atomic
    workflows. v1 delivery recipe: IPW → IDW --rw (continuous; BR-102 sub-agent delegation).
  version: "1.2.0"

  triggers:
    - "MWF"
    - "mwf"

  flags:
    - name: push
      long: "--push"
      description: "Forward to IDW --rw leg for RW Step 12 push + 12.5"
    - name: art
      long: "--art"
      description: "Forward to IDW --rw leg for RW version adoption"

  recipes:
    delivery:
      aliases: ["ipw,idw,rw"]
      preflight:
        rw_task_intent: validate_mwf_delivery_preflight.py
        when: before_first_leg
        abort_token: "MWF ABORTED (preflight: RW intent)"
      legs:
        - workflow: ipw
          when: no_linked_ipp
          delegate: subagent
          mode: plan
          guide: ".claude/commands/ipw.md"
        - workflow: idw_rw
          delegate: parent_or_subagent
          mode: implementation
          guide: ".claude/commands/idw.md"
          flags: ["--rw"]

  prerequisites:
    - parseable_est_token
    - recipe_specified

  documentation:
    command: ".claude/commands/mwf.md"
    agent_execution: "KB/Documentation/Developer_Docs/vwmp/meta-workflow-agent-execution.md"
