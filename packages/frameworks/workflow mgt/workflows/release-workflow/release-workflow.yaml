name: Release Workflow
version: 2.3.0
type: release
description: Automated release workflow with PDCA integration (version bump, changelog, commit, tag, push, verification, action, PIR trigger). Includes Step 9: IDE problem checking and Step 17: Housekeeping.

config:
  version_file: src/{project}/version.py
  changelog_dir: docs/changelog-and-release-notes/changelog-archive
  main_changelog: CHANGELOG.md
  scripts_path: packages/frameworks/workflow mgt/scripts

steps:
  - id: step-1
    name: Branch Safety Check
    type: branch_safety_check
    handler: release.branch_safety_check
    required: true
    mandatory: true
    blocking: true
    dependencies: []
    config:
      use_validator: true
      strict_mode: true
      scripts_path: scripts/validation

  - id: step-2
    name: Bump Version
    type: version_bump
    handler: release.version_bump
    required: true
    dependencies:
      - step-1
    config:
      increment_type: patch
      version_file: ${config.version_file}

  - id: step-2.5
    name: Package Version Workflow (PVW)
    type: package_version
    handler: package.version_bump
    required: false
    enabled: true
    dependencies:
      - step-2
    config:
      packages_dir: packages/frameworks
      auto_detect_changes: true
      validation_scripts: scripts/validation/package

  - id: step-3
    name: Create Detailed Changelog
    type: changelog_create
    handler: release.changelog_create
    required: true
    dependencies:
      - step-2
    config:
      changelog_dir: ${config.changelog_dir}
      format: full_timestamp

  - id: step-4
    name: Update Main Changelog
    type: changelog_update
    handler: release.changelog_update
    required: true
    dependencies:
      - step-3
    config:
      main_changelog: ${config.main_changelog}
      date_format: DD-MM-YY

  - id: step-5
    name: Update README
    type: readme_update
    handler: release.readme_update
    required: true
    enabled: true
    dependencies:
      - step-2
    config:
      readme_file: README.md
      update_version_text: true  # MANDATORY: Update project version in README
      update_badge: true         # Optional: Update version badge if present
      update_latest_release: true # Optional: Update latest release callout if present

  - id: step-6
    name: Update BR/FR Docs
    type: br_fr_update
    handler: release.br_fr_update
    required: false
    enabled: true
    dependencies:
      - step-2
    config:
      br_fr_dir: docs/project-management/kanban/fr-br

  - id: step-7
    name: Scoped Kanban Reconciliation
    type: kanban_update
    handler: framework.kanban_update
    required: true
    mandatory: true
    blocking: true
    automatic: true
    dependencies:
      - step-2
    config:
      invocation_context: rw_step_7
      kanban_update_script: packages/frameworks/workflow mgt/scripts/update_kanban_docs.py
      epic_doc_pattern: docs/project-management/kanban/epics/Epic-{epic}/Epic-{epic}.md
      story_doc_pattern: docs/project-management/kanban/epics/Epic-{epic}/Story-{story}-*.md
      kanban_board: docs/project-management/kanban/kboard.md
      fr_br_uxr_board: docs/project-management/kanban/fbuboard.md
      use_rw_config: true

  - id: step-8
    name: Stage Files
    type: git_stage
    handler: git.stage_all
    required: true
    dependencies:
      - step-2
      - step-3
      - step-4
      - step-5
      - step-6
      - step-7
    config:
      paths:
        - "*"

  - id: step-9
    name: Run Validators
    type: validation
    handler: release.run_validators
    required: true
    mandatory: true
    blocking: true
    dependencies:
      - step-8
    config:
      strict_mode: true
      propagate_art_to: [validate_branch_context.py, validate_version_bump.py]
      validators:
        - scripts/validation/validate_branch_context.py
        - scripts/validation/validate_changelog_format.py
        - scripts/validation/validate_version_bump.py
        - scripts/changelog/check_changelog_size.py
        - scripts/validation/validate_changelog_archive_links.py
        - scripts/validation/validate_board_stamp_diff.py
        - scripts/validation/validate_kanban_state_icons.py
        - scripts/validation/validate_release_readiness.py
      non_blocking:
        - scripts/changelog/check_changelog_size.py
        - scripts/validation/validate_changelog_archive_links.py

  - id: step-9.5
    name: Changelog Management Workflow (CMW)
    type: changelog_management
    handler: changelog.cmw
    required: false
    enabled: true
    blocking: false
    dependencies:
      - step-9
    config:
      cmw_script: packages/frameworks/workflow mgt/scripts/changelog/cmw.py
      trigger_condition: size_threshold_exceeded
      auto_trigger: true
      use_rw_config: true

  - id: step-9.6
    name: Check IDE-Flagged Problems
    type: ide_linter_check
    handler: ide.lint_check
    required: false
    blocking: false
    dependencies:
      - step-9
    config:
      check_order: [errors, warnings, infos]
      use_read_lints: true

  - id: step-10
    name: Commit Changes
    type: git_commit
    handler: git.commit
    required: true
    dependencies:
      - step-9
      - step-9.5
      - step-9.6
    config:
      message_template: "Release v{version}: {summary}"

  - id: step-11
    name: Create Git Tag
    type: git_tag
    handler: git.create_tag
    required: true
    dependencies:
      - step-10
    config:
      tag_template: v{semver_version}
      internal_tag_template: v{internal_version}
      annotated: true
      detect_semver_strategy: true

  - id: step-12
    name: Push to Remote
    type: git_push
    handler: git.push
    required: true
    dependencies:
      - step-11
    config:
      push_tags: true
      remote: origin

  - id: step-12.5
    name: Create/Update GitHub Release
    type: github_release
    handler: release.github_release
    required: true
    dependencies:
      - step-12
    config:
      script: packages/frameworks/workflow mgt/scripts/create_github_release.py
      use_env_local: true

  - id: step-13
    name: Housekeeping
    type: housekeeping
    handler: ide.housekeeping
    required: true
    blocking: false
    dependencies:
      - step-12.5
    config:
      clear_workflow_step_tracker: true
      finalize_agent_run_log: true

parameters:
  - name: summary
    type: string
    required: true
    label: Release Summary
    description: Brief description of the release

  - name: change_type
    type: enum
    required: true
    default: tooling
    label: Release Type
    description: Type of release
    options:
      - value: feature
        label: Feature 🚀
      - value: fix
        label: Fix 🐞
      - value: infrastructure
        label: Infrastructure 🔧
      - value: security
        label: Security 🔒
      - value: cleanup
        label: Cleanup 🧹
      - value: refactor
        label: Refactor 🔄
      - value: documentation
        label: Documentation 📚
      - value: tooling
        label: Tooling 🧰
      - value: maintenance
        label: Maintenance 🚧

  - name: detailed_changes
    type: textarea
    required: false
    label: Detailed Changes
    description: Optional detailed list of changes

  - name: skip_readme
    type: boolean
    required: false
    default: false
    label: Skip README Update

  - name: kb_docs_ok
    type: boolean
    required: true
    default: false
    label: KB Documentation Updated
    description: Confirm all required KB documentation is updated
