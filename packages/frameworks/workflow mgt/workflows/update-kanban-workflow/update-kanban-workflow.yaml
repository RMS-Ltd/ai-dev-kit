name: Update Kanban Workflow
version: 1.2.0
type: kanban_update
description: Bottom-up kanban documentation synchronization workflow to prevent status drift (triggered by UKW). REQUIRES AGENTIC INTELLIGENCE for synthesis, narrative updates, prioritization, and status inference. FR-050 — explicit FBU temporal sync (fbuboard cleanup, fbu-completed timestamps, 20-recent dashboard).

config:
  kanban_root: docs/project-management/kanban
  epic_doc_pattern: epics/Epic-{epic}/Epic-{epic}.md
  story_doc_pattern: epics/Epic-{epic}/Story-{story}-*.md
  task_doc_pattern: epics/Epic-{epic}/Story-{story}/T{task}-*.md
  kanban_board: kboard.md
  completed_archive: kanban-completed.md
  fr_br_uxr_board: fbuboard.md
  fr_br_uxr_completed: fbu-completed.md
  fr_br_uxr_structure: fbu-structure.md
  fr_br_uxr_completed_skill: .cursor/skills/fr-br-uxr-completed-update/SKILL.md
  normalize_board_timestamps_script: packages/frameworks/workflow mgt/scripts/kanban/normalize_board_row_timestamps.py
  snapshot_boards_script: packages/frameworks/workflow mgt/scripts/kanban/snapshot_kanban_boards.py
  validate_board_stamp_diff_script: packages/frameworks/workflow mgt/scripts/validation/validate_board_stamp_diff.py
  kanban_structure: kanban-structure.md
  fr_br_root: fr-br
  git_commit_history_days: 7
  use_rw_config: true
  fbu_recent_dashboard_limit: 20

steps:
  - id: step-1
    name: Identify Perpetual UKW Task (Wiring Step)
    type: wiring
    handler: kanban.identify_perpetual_task
    required: true
    mandatory: true
    blocking: false
    dependencies: []
    config:
      task_doc_pattern: ${config.task_doc_pattern}
      kanban_root: ${config.kanban_root}
      perpetual_task_flag: perpetual_task
      perpetual_task_type: "Perpetual Maintenance"
      description: "Discovers and wires UKW to the project's perpetual UKW task. Establishes relationship between UKW workflow and the task that will receive UKW release attributions."

  - id: step-2
    name: Analyze Recent Activity
    type: analysis
    handler: kanban.analyze_activity
    required: true
    mandatory: true
    blocking: false
    dependencies:
      - step-1
    config:
      git_commit_history_days: ${config.git_commit_history_days}
      analyze_fr_br: true
      analyze_commits: true
      analyze_file_changes: true

  - id: step-3
    name: Update Task Documents
    type: task_update
    handler: kanban.update_tasks
    required: true
    mandatory: true
    blocking: false
    dependencies:
      - step-2
    config:
      task_doc_pattern: ${config.task_doc_pattern}
      kanban_root: ${config.kanban_root}
      consider_commits: true
      consider_fr_br: true
      update_status: true
      update_last_updated: true

  - id: step-4
    name: Update Story Documents
    type: story_update
    handler: kanban.update_stories
    required: true
    mandatory: true
    blocking: false
    dependencies:
      - step-3
    config:
      story_doc_pattern: ${config.story_doc_pattern}
      kanban_root: ${config.kanban_root}
      synthesize_tasks: true
      intelligent_synthesis: true
      update_task_checklists: true
      update_tactical_overview: true
      narrative_style: natural
      update_status: true

  - id: step-5
    name: Update Epic Documents
    type: epic_update
    handler: kanban.update_epics
    required: true
    mandatory: true
    blocking: false
    dependencies:
      - step-4
    config:
      epic_doc_pattern: ${config.epic_doc_pattern}
      kanban_root: ${config.kanban_root}
      synthesize_stories: true
      intelligent_synthesis: true
      update_story_checklists: true
      update_strategic_overview: true
      narrative_style: natural
      update_status: true

  - id: step-6
    name: Update Kanban Board
    type: board_update
    handler: kanban.update_board
    required: true
    mandatory: true
    blocking: false
    dependencies:
      - step-5
    config:
      kanban_board: ${config.kanban_board}
      kanban_root: ${config.kanban_root}
      # Part A: removal and archival (executes before classification)
      remove_completed_before_classify: true
      completed_statuses:
        - COMPLETE
        - DONE
      write_completed_to_archive: true
      completed_archive: kanban-completed.md
      deduplication_guard: true
      dedup_priority_order:
        - Must Have
        - Should Have
        - Could Have
        - Ongoing
        - Won't Have
      # Part B: classification (executes after Part A)
      update_moscow_list: true
      intelligent_prioritization: true
      analyze_context: true
      update_epic_summaries: true
      update_last_updated: true

  - id: step-6-5
    name: FBU Board Cleanup (fbuboard)
    type: fbu_board_update
    handler: kanban.update_fr_br_uxr_board
    required: true
    mandatory: true
    blocking: false
    run_when:
      - comprehensive
      - bookkeeping
    dependencies:
      - step-6
    config:
      fr_br_uxr_board: ${config.fr_br_uxr_board}
      fr_br_root: ${config.fr_br_root}
      kanban_root: ${config.kanban_root}
      remove_terminal_from_active: true
      terminal_statuses:
        - COMPLETE
        - COMPLETED
        - IMPLEMENTED
        - FIXED
        - RESOLVED
      keep_unresolved_verification_exceptions: true
      unresolved_verification_tokens:
        - IN PROGRESS
        - UNVERIFIED
        - PENDING VERIFICATION
      board_stamp_authority_fr097: preserve_row_last_modified_on_hygiene
      align_board_last_updated_metadata_only: true
      pre_write_concurrency_revalidation: true
      snapshot_before_ukw: ${config.snapshot_boards_script}
      validate_stamps_before_stage: ${config.validate_board_stamp_diff_script}

  - id: step-6-6
    name: FBU Temporal Tracking (fbu-completed)
    type: fbu_completed_update
    handler: kanban.update_fr_br_uxr_completed
    required: true
    mandatory: true
    blocking: false
    run_when:
      - comprehensive
      - bookkeeping
    dependencies:
      - step-6-5
    config:
      fr_br_uxr_completed: ${config.fr_br_uxr_completed}
      fr_br_uxr_completed_skill: ${config.fr_br_uxr_completed_skill}
      kanban_root: ${config.kanban_root}
      timestamp_format: ISO8601_Z
      timestamp_pattern: "YYYY-MM-DDTHH:MM:SSZ"
      write_on_same_run_as_board_cleanup: true
      recent_dashboard_limit: ${config.fbu_recent_dashboard_limit}
      recent_dashboard_heading: "20 Most Recently Completed FR/BR/UXR Items"
      format_reference: ${config.completed_archive}
      deduplication_guard: true

  - id: step-6-7
    name: FBU Cross-Document Consistency
    type: fbu_validation
    handler: kanban.validate_fr_br_uxr_consistency
    required: true
    mandatory: true
    blocking: false
    run_when:
      - comprehensive
      - bookkeeping
    dependencies:
      - step-6-6
    config:
      fr_br_uxr_board: ${config.fr_br_uxr_board}
      fr_br_uxr_completed: ${config.fr_br_uxr_completed}
      fr_br_uxr_structure: ${config.fr_br_uxr_structure}
      fr_br_root: ${config.fr_br_root}
      check_active_board_vs_source_status: true
      check_completed_archive_vs_source: true
      check_structure_inventory_vs_fr_br_root: true
      check_link_integrity: true
      check_version_marker_alignment: true

  - id: step-7
    name: Validate Consistency
    type: validation
    handler: kanban.validate_consistency
    required: true
    mandatory: true
    blocking: false
    dependencies:
      - step-6-7
    config:
      check_status_alignment: true
      check_version_consistency: true
      check_link_integrity: true
      check_fbu_cross_document_consistency: true
      fbu_surfaces:
        - ${config.fr_br_uxr_board}
        - ${config.fr_br_uxr_completed}
        - ${config.fr_br_uxr_structure}

  - id: step-8
    name: Stage Files
    type: git_stage
    handler: git.stage_all
    required: true
    dependencies:
      - step-7
    config:
      paths:
        - "${config.kanban_root}/**"

  - id: step-9
    name: Document Changes
    type: documentation
    handler: kanban.document_changes
    required: false
    dependencies:
      - step-8
    config:
      create_summary: true
      list_updated_docs: true
      note_rw_integration: true  # Note: After UKW, user typically runs RW to commit changes. RW will detect UKW context and auto-attribute to perpetual UKW task.

