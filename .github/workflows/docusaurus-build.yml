# FR-069 / FR-070 / ADR-017 / E5:S09:T14 — Single workflow: build + deploy (artifact handoff).
# Topology: docs/architecture/standards-and-adrs/ADR-017-docusaurus-ci-build-deploy-topology.md
# PR: build job only. main push / workflow_dispatch: build then deploy (needs: + artifact).
name: Docusaurus site build

# Quote `on` so YAML 1.1 parsers (e.g. PyYAML) do not treat it as boolean true.
"on":
  pull_request:
    paths:
      - "portal/**"
      - "docs/**"
      - ".github/workflows/docusaurus-build.yml"
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - "docs/**"
      - ".github/workflows/docusaurus-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: portal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-build
          path: portal/build
          retention-days: 1

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: portal-build
          path: portal/build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./portal/build
          force_orphan: false
