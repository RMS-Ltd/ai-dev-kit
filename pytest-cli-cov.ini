# Dedicated pytest config for ai-dev-kit CLI coverage (opt-in).
# Default `pytest.ini` does not enable coverage — avoids misleading 0% CLI
# reports when running portal, kanban, or other non-CLI tests locally.
#
# Usage:
#   bash scripts/run_cli_pytest_coverage.sh
#   python -m pytest -c pytest-cli-cov.ini tests/
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=cli
    --cov-report=term-missing
    --cov-report=html:htmlcov/cli
markers =
    unit: Unit tests
    integration: Integration tests
    backend: Backend-specific tests
    slow: Slow-running tests
    portal_build: Docusaurus portal build; green gate uses PORTAL_BUILD_STRICT=1 (FR-067)
    fr006: FR-006 localisation regression (E21:S01–S03; Phase 1 + Phase 3 E2E)
