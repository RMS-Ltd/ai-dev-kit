# RW Config: ai-dev-kit-book (private book continuation)
# Public frameworks: RMS-Ltd/ai-dev-kit — see canonical_* keys below
# Part of: E6:S06:T07 - Framework Hardening (Phase 3)

version_file: src/ai_dev_kit/version.py
main_changelog: CHANGELOG.md
changelog_dir: docs/changelog-and-release-notes/changelog-archive
scripts_path: packages/frameworks/workflow-mgt/scripts
readme_file: README.md

changelog_archival:
  # Mode controlling how entries are retained in CHANGELOG.md.
  # - hybrid (default in framework docs): size/time/version-count based
  # - latest_only (ai-dev-kit choice): keep only the newest release entry
  #   in the main changelog, with all older releases archived.
  mode: latest_only

# Enable Kanban integration
use_kanban: true

# Kanban paths (relative to kanban_root)
kanban_root: docs/kanban
epic_doc_pattern: epics/epic-{epic:02d}/epic-{epic:02d}.md
story_doc_pattern: epics/epic-{epic:02d}/story-{story:02d}-*.md
task_doc_pattern: epics/epic-{epic:02d}/story-{story:02d}-*/T{task:02d}-*.md
kanban_board: kboard.md
fr_br_root: docs/kanban/fr-br

# Use dev-kit versioning schema
versioning_schema: RC.EPIC.STORY.TASK+BUILD
dev_branch_epic: 2

# FR-059 workflow forensic journals (ADR-008)
journal_dir: docs/journals
journal_ttl_days: 7
journal_failed_ttl_days: 30

# FR-044 / E05:S01:T44 — RW temporary execution log (ADR-011 reference writer)
rw_execution_log_path: .rw-execution.log
agent_run_log_dir: docs/journals/agent-runs
rw_execution_log_truncate_on_start: true

# FR-097 board stamp enforcement (pre-commit + release Gate 8)
board_stamp:
  homogeneity_threshold: 3  # fail when ≥3 rows share identical Last modified

# FR-115 / FR-116 — async ingest read model (gitignored SQLite; markdown/YAML remain SoT)
release_metadata_store:
  path: .data/adk-release-metadata.sqlite
  gitignore: true

ingest:
  enabled: true
  semver_registry_file: docs/changelog-and-release-notes/changelog-archive/semver-registry-legacy-final.yaml
  incremental: true

# SemVer mapping strategy: "registry" (default) or "task_touch"
# registry: Hybrid approach with epic/story registry (current default)
# task_touch: ADR-002 task-touch derived mapping (strictly monotonic)
semver_mapping_strategy: task_touch

# Release-state backend (E02:S17:T04/T07): legacy = semver-registry.yaml; sqlite = .adk/release-state.db
release_state_backend: sqlite
release_state_db: .adk/release-state.db
release_state_export_yaml: .adk/semver-registry-export.yaml

# FR-122 / E02:S01:T30 — RW Step 1e/1f preflight (ADR-027)
allocator_health:
  enabled: true
  min_patch_floor: 1000
git_tag_occupancy:
  enabled: true
release_coherence:
  enabled: true

# Versioning mode policy:
# - dual: internal RC.EPIC.STORY.TASK+BUILD + external SemVer (requires task_touch)
# - semver_only: SemVer-only workflows
# - kanban_only: internal/Kanban-only workflows
versioning_mode: dual

# Project name
project_name: ai-dev-kit-book

# FR-099 / ADR-006 repository roles (E1:S04:T07)
canonical_public_repo: RMS-Ltd/ai-dev-kit
canonical_public_repo_url: https://github.com/RMS-Ltd/ai-dev-kit.git
canonical_public_pages_url: https://rms-ltd.github.io/ai-dev-kit/
maintainer_private_repo: RMS-Ltd/ai-dev-kit-book
maintainer_private_repo_url: https://github.com/RMS-Ltd/ai-dev-kit-book.git

# Notion — Teamspaces → RMS (project pages at teamspace root; 2026-06-08)
notion_hub_url: https://www.notion.so/30db6f8962c1810daf71f96bb601d69b

# AI Dev Kit maintainer KB (Decisions, Reference, Investigations, Records) — child of AI Dev Kit project page
notion_kb_url: https://www.notion.so/378b6f8962c18189aacbe8629677403d

# Epic ranges
canonical_epic_range: "1-23"
project_specific_epic_range: "24+"

# FR-113 / E08:S03:T17 — Local Code Quality Gate (CQG)
code_quality_gate:
  enabled: true
  target_branch: dev
  query_suite: security-and-quality
  language: python
  source_roots:
    - packages/frameworks
    - scripts
    - cli
    - src
  monitor_cron: "0 */6 * * *"
  staleness_hours: 12
  reports_dir: .cqg/reports
  cache_dir: .cqg/cache
  last_run_file: .cqg/last-run.json
  idw_threshold: warnings
  idw_advisory: false
  retention_count: 10
  codeql_command: codeql

# E08:S03:T15 / FR-112 — RW Step 9.7 Actions CI parity (mirror .github/workflows/*)
actions_ci_parity:
  enabled: true
  # checks: optional override; defaults in validate_actions_ci_parity.py

