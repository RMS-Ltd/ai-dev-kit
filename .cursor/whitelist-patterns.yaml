---
# IDE Command Whitelist — pattern catalog (SoT)
# Project: ai-dev-kit | ADR-013 | E06:S07:T107
# Version: 1.1 | Updated: 2026-05-30
#
# Cursor does NOT load this file automatically. Use docs/developer-tools/ide-whitelist-guide.md
# to translate patterns into Cursor Auto-Run / allowlist settings. Run validate_whitelist_patterns.py.

description: |
  Regex catalog for common agent terminal commands. Substitute {PROJECT_ROOT} with your
  repository absolute path when testing examples or configuring IDE allowlists.

patterns:
  python_validation_scripts:
    pattern: '^python "packages/frameworks/workflow-mgt/scripts/validation/validate_[a-z0-9_]+\.py"(\s+.*)?$'
    description: "RW/UKW validation scripts under workflow mgt"
    examples:
      - 'python "packages/frameworks/workflow-mgt/scripts/validation/validate_branch_context.py" --strict'
      - 'python "packages/frameworks/workflow-mgt/scripts/validation/validate_changelog_format.py"'
      - 'python "packages/frameworks/workflow-mgt/scripts/validation/validate_version_bump.py" --requested "E06:S07:T107" --strict'
      - 'python "packages/frameworks/workflow-mgt/scripts/validation/validate_rw_task_complete.py" --requested "E06:S07:T107"'
      - 'python "packages/frameworks/workflow-mgt/scripts/validation/validate_kanban_state_icons.py" --strict'
    negative_examples:
      - 'python "other/validate_branch_context.py" --strict'

  python_framework_scripts:
    pattern: '^python "packages/frameworks/workflow-mgt/scripts/(?:[a-z0-9_]+/)*[a-z0-9_]+\.py"(\s+.*)?$'
    description: "Other workflow mgt Python scripts (kanban, release, etc.)"
    examples:
      - 'python "packages/frameworks/workflow-mgt/scripts/create_github_release.py" --summary "Test" --epic 6 --story 7 --task 107'
      - 'python "packages/frameworks/workflow-mgt/scripts/update_kanban_docs.py"'
    negative_examples:
      - 'python "packages/frameworks/kanban/scripts/foo.py"'

  python_semver_converter:
    pattern: '^python "packages/frameworks/workflow-mgt/scripts/version/semver_converter\.py"(\s+.*)?$'
    description: "SemVer conversion for RW README/tags"
    examples:
      - 'python "packages/frameworks/workflow-mgt/scripts/version/semver_converter.py" "0.6.7.107+1"'

  git_rw_operations:
    pattern: '^git (add|status|commit|push|tag|checkout|branch|log|diff|restore|show|merge|pull|fetch)(\s+.*)?$'
    description: "Git commands used in RW (excludes push --force; add explicit rule if needed)"
    examples:
      - 'git add -A'
      - 'git status'
      - 'git commit -m "Release v0.6.7.107+1: summary"'
      - 'git push origin main --tags'
      - 'git log -1 --oneline'
    negative_examples:
      - 'svn status'

  gh_cli_operations:
    pattern: '^gh (pr|release|issue|api)(\s+.*)?$'
    description: "GitHub CLI for releases and PR hygiene"
    examples:
      - 'gh pr create --title "Example" --body "Body"'
      - 'gh release view v0.4.843+2'

  find_project_operations:
    pattern: '^find \{PROJECT_ROOT\}(\s+.*)?$'
    description: "Find under repo root — use {PROJECT_ROOT} placeholder, not home paths"
    examples:
      - 'find {PROJECT_ROOT} -name "*.py"'
      - 'find {PROJECT_ROOT} -maxdepth 3 -name "validate_*.py"'

  rg_search_operations:
    pattern: '^rg(\s+.*)?$'
    description: "ripgrep search (agent grep tool shapes)"
    examples:
      - 'rg --pattern "whitelist" --path docs'

  pytest_framework:
    pattern: '^python (-m pytest(\s+.*)?|"packages/frameworks/workflow-mgt/scripts/validation/test_validate_[a-z_]+\.py")$'
    description: "Framework validator pytest (-m) or direct test module invocation"
    examples:
      - 'python -m pytest -c "packages/frameworks/workflow-mgt/scripts/validation/pytest.ini" "packages/frameworks/workflow-mgt/scripts/validation/test_validate_whitelist_patterns.py"'
      - 'python "packages/frameworks/workflow-mgt/scripts/validation/test_validate_whitelist_patterns.py"'

# Security grouping (documentation for maintainer allowlist tiers — not enforced by YAML)
contexts:
  high_security:
    description: "Mutating git, edits, shell — approve deliberately in Cursor"
    patterns:
      - git_rw_operations
      - gh_cli_operations
  medium_security:
    description: "Validation and framework scripts"
    patterns:
      - python_validation_scripts
      - python_framework_scripts
      - python_semver_converter
      - pytest_framework
  low_security:
    description: "Read-only search"
    patterns:
      - find_project_operations
      - rg_search_operations

# Maintainer notes only — Cursor does not read these keys
recommended_maintainer_settings:
  cursor_integration: |
    Apply patterns via .cursor/permissions.json (terminalAllowlist prefixes).
    Enable Run Mode → Allowlist in Cursor Settings. See docs/developer-tools/ide-whitelist-guide.md.
  review_frequency: monthly
  forbidden_patterns:
    - '^.*$'
    - 'git push.*--force'

maintenance:
  monitor_pattern_usage: true
  validator_command: 'python "packages/frameworks/workflow-mgt/scripts/validation/validate_whitelist_patterns.py"'
