# Board stamp authority (FR-097) — install: pre-commit install
# See packages/frameworks/workflow-mgt/KB/Documentation/Developer_Docs/vwmp/board-stamp-authority.md

repos:
  - repo: local
    hooks:
      - id: validate-board-stamps
        name: FR-097 board stamp homogeneity + diff guard
        entry: python "packages/frameworks/workflow-mgt/scripts/validation/validate_board_stamps_precommit.py"
        language: system
        files: ^docs/kanban/(kboard|fbuboard)\.md$
        pass_filenames: false
      - id: validate-active-kanban-board
        name: FR-109 active board lean contract
        entry: python "packages/frameworks/workflow-mgt/scripts/validation/validate_active_kanban_board.py" --strict
        language: system
        files: ^docs/kanban/(kboard|fbuboard)\.md$
        pass_filenames: false
      - id: validate-portal-publish-scope
        name: BR-068/FR-114 adopter-public link guard
        entry: pytest tests/test_portal_br068_monorepo_links.py tests/test_portal_fr114_allowlist.py -q --tb=line
        language: system
        files: ^docs/(guides|documentation)/
        pass_filenames: false
      - id: validate-greenfield-install-sync
        name: FR-110 greenfield-install drift guard
        entry: python scripts/sync_greenfield_install.py --check
        language: system
        files: ^packages/frameworks/
        pass_filenames: false
